name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install flatc
        run: |
          FLATC_VERSION="$(cat .flatc-version)"
          curl -fL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip flatc.zip
          sudo install -m 0755 flatc /usr/local/bin/flatc
          flatc --version
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install flatc
        run: |
          FLATC_VERSION="$(cat .flatc-version)"
          curl -fL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip flatc.zip
          sudo install -m 0755 flatc /usr/local/bin/flatc
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features

  # StreamWorker / KvWorker and #[nats_route] integration tests against a
  # real broker. GitHub service containers can't pass container args (the -js
  # flag that enables JetStream), so the broker runs as a docker step.
  nats-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            nats:2.10-alpine -js -m 8222
          # Docker's port proxy binds the host port before the server
          # inside is listening, so a TCP probe reports ready too early.
          # /healthz is the server's own readiness, JetStream included.
          for _ in $(seq 1 30); do
            curl -sf localhost:8222/healthz && exit 0
            sleep 1
          done
          docker logs nats
          exit 1
      - run: cargo test -p flatbed --features nats,openapi --test nats_broker --test nats_route_broker -- --ignored

  check-generated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install flatc
        run: |
          FLATC_VERSION="$(cat .flatc-version)"
          curl -fL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip flatc.zip
          sudo install -m 0755 flatc /usr/local/bin/flatc
      - run: bash scripts/check-generated.sh

  # The agent harness is instructions plus two enforcement seams, none of which
  # the Rust jobs compile. Without these the merge gate's decision paths, the
  # hook that denies the GraphQL-backed gh porcelain, and the skills' wiring to
  # real workflow/login/repo names are all unverified prose.
  agent-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical agent skills
        run: bash scripts/validate-agent-skills.sh
      - name: Test Claude hook guards
        run: bash scripts/test-claude-hooks.sh
      - name: Test merge-gate contracts
        run: bash scripts/test-merge-gate-contracts.sh

  # The examples/ projects are standalone packages (own [workspace] table), so
  # the workspace clippy/test jobs above don't reach them. Lint each one so a
  # framework API change can't silently break a published example.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install flatc
        run: |
          FLATC_VERSION="$(cat .flatc-version)"
          curl -fL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip flatc.zip
          sudo install -m 0755 flatc /usr/local/bin/flatc
          flatc --version
      - run: |
          for manifest in examples/*/Cargo.toml; do
            echo "::group::clippy $manifest"
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            echo "::endgroup::"
          done

  # The TypeScript client package is outside the cargo workspace; typecheck and
  # test it on its own.
  flatbed-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run -w @plonklabs/flatbed-client typecheck
      - run: npm run -w @plonklabs/flatbed-client test

  codec-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install flatc
        run: |
          FLATC_VERSION="$(cat .flatc-version)"
          curl -fL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip flatc.zip
          sudo install -m 0755 flatc /usr/local/bin/flatc
      - run: bash scripts/check-ts-reflection.sh
      - run: bash scripts/verify-fb-codec.sh

  flatbed-client-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install flatc
        run: |
          FLATC_VERSION="$(cat .flatc-version)"
          curl -fL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip flatc.zip
          sudo install -m 0755 flatc /usr/local/bin/flatc
      - run: bash scripts/verify-fb-client-npm.sh

  # Alert Discord only on main-branch breakage. PR failures are visible to the
  # author already, and fork PRs don't get the DISCORD_WEBHOOK secret.
  notify-failure:
    needs: [fmt, clippy, test, nats-integration, check-generated, agent-harness, examples, flatbed-client, codec-compat, flatbed-client-e2e]
    if: failure() && github.event_name == 'push'
    uses: plonklabs/.github/.github/workflows/discord-notify-failure.yml@main
    with:
      workflow_name: CI
    secrets: inherit
