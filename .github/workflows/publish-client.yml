name: Publish flatbed-client to npm

# Tag-driven publish of @plonklabs/flatbed-client. Primary trigger is a
# `flatbed-client-v*` tag push; the version in the tag must match the
# package.json version. `NPM_TOKEN` is a repo secret. This tag namespace is
# distinct from the Rust `flatbed-v*` tags, so the two release paths never collide.
#
# `workflow_dispatch` re-runs publish against an existing tag without
# re-pushing it (dispatch against `--ref flatbed-client-vX.Y.Z`).

on:
  push:
    tags: ['flatbed-client-v*']
  workflow_dispatch:

concurrency:
  group: publish-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#flatbed-client-v}"
          pkg="$(node -p "require('./clients/ts/flatbed-client/package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "tag $GITHUB_REF_NAME does not match package version $pkg" >&2; exit 1; }
      - run: npm publish -w @plonklabs/flatbed-client --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify-failure:
    needs: [publish]
    if: failure()
    uses: plonklabs/.github/.github/workflows/discord-notify-failure.yml@main
    with:
      workflow_name: Publish flatbed-client to npm
    secrets: inherit
